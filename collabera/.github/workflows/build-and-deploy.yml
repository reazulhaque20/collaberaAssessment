name: Build and Deploy Collabera App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build with maven and docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: action/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Cache maven dependencies
        uses: action/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn clean package -DskipTests


      - name: Build Docker image
        run: docker build -t ${{ github.repository }}:latest .


      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ github.repository }}:latest ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-app:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-app:latest